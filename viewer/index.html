<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Streamy — Live Streams</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <meta
      name="description"
      content="A simple grid for watching and controlling live streams"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-left">
          <div class="channel">
            <span class="channel-hash">#</span>
            <span id="channel-name">General</span>
          </div>
          <span
            class="status-badge"
            id="status"
            data-state=""
            title="Signaling connection status"
            >Connecting</span
          >
        </div>

        <div class="topbar-right">
          <span class="count" id="count"></span>
          <a
            href="https://github.com/thenightserver/streamy/releases/latest"
            class="topbar-btn"
            id="download-btn"
            target="_blank"
            rel="noopener noreferrer"
            title="Download Streamy for Windows"
          >
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <span>Download</span>
          </a>
          <button
            type="button"
            class="topbar-btn icon-only"
            id="reconnect"
            title="Reconnect stream"
            hidden
          >
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"
              />
            </svg>
          </button>
        </div>
      </header>

      <p class="viewer-notice" id="viewer-message" role="status" aria-live="polite" hidden></p>

      <!-- Workspace view: dynamic grid & stage -->
      <main class="workspace" id="workspace">
        <section class="stage" id="stage"></section>
      </main>

      <!-- Manual SDP Diagnostics view (?manual=1 or manual-toggle) -->
      <section class="manual-section" id="manual" hidden>
        <div class="manual-panel">
          <div class="manual-header">
            <h2 class="manual-title">
              <svg class="icon icon-md" viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="4 17 10 11 4 5" />
                <line x1="12" y1="19" x2="20" y2="19" />
              </svg>
              Manual SDP Diagnostics
            </h2>
            <p class="manual-desc">
              Direct peer-to-peer connection for testing with
              <code>streamy-manual</code> without a signaling server.
            </p>
          </div>

          <div class="manual-field">
            <label class="manual-label" for="offer">1. Offer from host</label>
            <textarea
              class="manual-textarea"
              id="offer"
              placeholder="Paste the complete SDP offer from the host terminal here…"
            ></textarea>
            <div class="manual-actions">
              <button type="button" class="btn-primary" id="connect">
                Create Answer
              </button>
              <button type="button" class="btn-secondary" id="reset">
                Reset
              </button>
            </div>
          </div>

          <div class="manual-field">
            <label class="manual-label" for="answer">2. Answer for host</label>
            <textarea
              class="manual-textarea"
              id="answer"
              readonly
              placeholder="Your WebRTC answer will appear here…"
            ></textarea>
            <div class="manual-actions">
              <button type="button" class="btn-secondary" id="copy" disabled>
                Copy Answer
              </button>
            </div>
          </div>

          <p
            class="manual-message"
            id="message"
            role="status"
            aria-live="polite"
          ></p>
        </div>

        <div class="manual-preview">
          <div class="manual-preview-header">
            <span>Manual Stream Preview</span>
          </div>
          <div class="manual-preview-body" id="manual-preview-body"></div>
        </div>
      </section>

      <!-- Persistent Player Element Host (moved via JS appendChild so video playback is never interrupted) -->
      <div id="player-staging" hidden>
        <div id="player" class="player-container">
          <video id="video" playsinline autoplay muted></video>
          <div id="player-hint" class="player-hint">
            <div class="hint-spinner"></div>
            <p class="hint-text" id="player-hint-text">
              Waiting for video stream…
            </p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
